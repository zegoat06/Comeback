<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - SWIFTb</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space) 0;
      border-bottom: 1px solid var(--gray-200);
      margin-bottom: var(--space);
      flex-wrap: wrap;
      gap: var(--space);
    }
    .header .logo {
      font-family: 'Poppins', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }
    .header .logo span { color: var(--accent); }
    .user-info {
      display: flex;
      align-items: center;
      gap: var(--space);
      flex-wrap: wrap;
    }
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }
    .status-icon { font-size: 2.5rem; color: var(--accent); }
    .quick-actions { display: flex; gap: var(--space); flex-wrap: wrap; }
    .help-box {
      background: var(--gray-50);
      border-radius: var(--radius);
      padding: var(--space);
      margin-top: var(--space);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div>
        <div class="logo">SWIFT<span>b</span></div>
        <span class="text-muted" style="font-size:0.8rem;">Online Account Opening</span>
      </div>
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">D</div>
        <span id="userName" style="font-size:0.875rem;font-weight:500;"></span>
        <button class="btn btn-secondary btn-sm" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </div>

    <!-- Status Card -->
    <div class="card">
      <div style="display:flex;align-items:center;gap:var(--space);">
        <div class="status-icon"><i class="fas fa-file-invoice"></i></div>
        <div style="flex:1;">
          <div class="card-header">Your Application Status</div>
          <div id="statusContent">
            <p class="text-muted">Loading...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="mt-3">
      <h3>Quick Actions</h3>
      <div class="quick-actions mt-2">
        <a href="./apply-step1.html" class="btn btn-gold">
          <i class="fas fa-plus"></i> Start Application
        </a>
        <a href="./application-status.html" class="btn btn-secondary">
          <i class="fas fa-search"></i> View Status
        </a>
        <a href="./profile.html" class="btn btn-secondary">
          <i class="fas fa-user"></i> My Profile
        </a>
      </div>
    </div>

    <!-- Help -->
    <div class="help-box">
      <h4><i class="fas fa-info-circle" style="color:var(--accent);"></i> Need Help?</h4>
      <p style="font-size:0.875rem;color:var(--gray-500);">
        Contact your selected bank's customer support for assistance with your application.
      </p>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const token = sessionStorage.getItem('token');
      const user = getUserData();
      
      if (!token || !user) {
        showToast('Please login first', 'warning');
        setTimeout(() => {
          window.location.href = '../../loginPage.html';
        }, 1000);
        return;
      }

      if (user && user.fullName) {
        document.getElementById('userName').textContent = user.fullName;
        document.getElementById('userAvatar').textContent = user.fullName.charAt(0).toUpperCase();
      }

      loadApplicationStatus();
    });

    async function loadApplicationStatus() {
      const content = document.getElementById('statusContent');
      
      try {
        const applications = await api.getMyApplications();
        
        if (!applications || applications.length === 0) {
          content.innerHTML = `
            <p class="text-muted">You haven't started an application yet.</p>
            <a href="./apply-step1.html" class="btn btn-gold btn-sm mt-2">
              Start Your Application
            </a>
          `;
          return;
        }

        const app = applications[0];
        const statusMap = {
          PENDING: 'Pending Review',
          APPROVED: 'Approved ✅',
          REJECTED: 'Rejected ❌',
          RESUBMISSION: 'Resubmission Requested'
        };
        const badgeClass = {
          PENDING: 'badge-pending',
          APPROVED: 'badge-approved',
          REJECTED: 'badge-rejected',
          RESUBMISSION: 'badge-resubmission'
        };

        content.innerHTML = `
          <div>
            <p><strong>Status:</strong> 
              <span class="badge ${badgeClass[app.status] || 'badge-pending'}">
                ${statusMap[app.status] || app.status}
              </span>
            </p>
            <p><strong>Account Type:</strong> ${app.accountType}</p>
            ${app.rejectionReason ? `<p><strong>Note:</strong> ${app.rejectionReason}</p>` : ''}
            ${app.remarks ? `<p><strong>Remarks:</strong> ${app.remarks}</p>` : ''}
          </div>
        `;
      } catch (error) {
        if (error.message.includes('Session expired')) {
          // Will redirect to login
        } else {
          content.innerHTML = `<p class="text-danger">Error loading status: ${error.message}</p>`;
        }
      }
    }

    function logout() {
      sessionStorage.removeItem('token');
      sessionStorage.removeItem('role');
      sessionStorage.removeItem('user');
      window.location.href = '../../loginPage.html';
    }
  </script>
</body>
</html>

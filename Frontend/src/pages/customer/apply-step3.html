<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step 3 - Upload ID - SWIFTb</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container" style="max-width:800px;">
    <div style="display:flex;align-items:center;gap:var(--space);padding:var(--space) 0;border-bottom:1px solid var(--gray-200);margin-bottom:var(--space);">
      <a href="./apply-step2.html" style="font-size:1.5rem;color:var(--primary);">
        <i class="fas fa-arrow-left"></i>
      </a>
      <h1 style="margin:0;">Apply for Account</h1>
    </div>

    <div class="stepper">
      <div class="step completed"><div class="circle"><i class="fas fa-check"></i></div><span class="label">Account Type</span></div>
      <div class="step completed"><div class="circle"><i class="fas fa-check"></i></div><span class="label">Personal Details</span></div>
      <div class="step active"><div class="circle">3</div><span class="label">Upload ID</span></div>
      <div class="step"><div class="circle">4</div><span class="label">Review & Submit</span></div>
    </div>

    <div class="card">
      <h2>Upload National ID</h2>
      <p class="text-muted">Upload a clear image of your National ID. Accepted: JPG, PNG, PDF (max 5MB).</p>

      <div id="uploadZone" class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <div class="icon"><i class="fas fa-cloud-upload-alt"></i></div>
        <div class="text">Drag & drop your National ID here, or click to browse</div>
        <input type="file" id="fileInput" accept="image/*,.pdf" style="display:none;" onchange="handleFile(event)" />
      </div>

      <div id="previewContainer" class="hidden mt-2">
        <div class="upload-preview">
          <img id="previewImage" src="" alt="ID Preview" />
          <div class="file-info">
            <div class="file-name" id="fileName">file.pdf</div>
            <div class="file-size" id="fileSize">0 MB</div>
          </div>
          <button class="btn btn-danger btn-sm" onclick="removeFile()">Remove</button>
        </div>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="input-group mt-2">
        <label>National ID Number *</label>
        <input type="text" id="idNumber" placeholder="Enter your ID number" />
        <div class="error-text" id="idError">Please enter a valid ID number</div>
      </div>

      <div id="uploadStatus" class="mt-2"></div>

      <div style="display:flex;justify-content:space-between;margin-top:var(--space);">
        <a href="./apply-step2.html" class="btn btn-secondary">
          <i class="fas fa-arrow-left"></i> Back
        </a>
        <button id="uploadBtn" class="btn btn-gold" onclick="uploadAndNext()">
          Upload & Continue <i class="fas fa-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    let selectedFile = null;
    let isUploading = false;

    document.addEventListener('DOMContentLoaded', () => {
      wizard.load();
      const data = wizard.data.nationalId;
      
      if (data.number) {
        document.getElementById('idNumber').value = data.number;
      }
      
      if (data.fileUrl && data.uploaded) {
        document.getElementById('previewImage').src = data.fileUrl;
        document.getElementById('fileName').textContent = 'ID uploaded successfully ✅';
        document.getElementById('previewContainer').classList.remove('hidden');
        document.getElementById('uploadStatus').innerHTML = 
          '<span style="color:var(--success);font-weight:500;">✅ ID already uploaded</span>';
        document.getElementById('uploadBtn').innerHTML = 'Continue <i class="fas fa-arrow-right"></i>';
      }
      
      setupDragDrop();
    });

    function setupDragDrop() {
      const zone = document.getElementById('uploadZone');
      zone.addEventListener('dragover', e => { 
        e.preventDefault(); 
        zone.classList.add('dragover'); 
      });
      zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
      zone.addEventListener('drop', e => {
        e.preventDefault();
        zone.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
          processFile(e.dataTransfer.files[0]);
        }
      });
    }

    function handleFile(e) {
      if (e.target.files.length) {
        processFile(e.target.files[0]);
      }
    }

    function processFile(file) {
      const validTypes = ['image/jpeg', 'image/png', 'image/jpg', 'application/pdf'];
      
      if (!validTypes.includes(file.type)) {
        showToast('Please upload JPG, PNG, or PDF files only.', 'error');
        return;
      }
      
      if (file.size > 5 * 1024 * 1024) {
        showToast('File size must be less than 5MB.', 'error');
        return;
      }

      selectedFile = file;
      
      document.getElementById('uploadStatus').innerHTML = '';
      document.getElementById('uploadBtn').innerHTML = 'Upload & Continue <i class="fas fa-arrow-right"></i>';

      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById('previewImage').src = e.target.result;
        document.getElementById('fileName').textContent = file.name;
        document.getElementById('fileSize').textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
        document.getElementById('previewContainer').classList.remove('hidden');
      };
      
      if (file.type === 'application/pdf') {
        document.getElementById('previewImage').src = 'https://via.placeholder.com/100x60?text=PDF';
        document.getElementById('previewContainer').classList.remove('hidden');
        document.getElementById('fileName').textContent = file.name;
        document.getElementById('fileSize').textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
      } else {
        reader.readAsDataURL(file);
      }
      
      showToast('File selected: ' + file.name, 'info');
    }

    function removeFile() {
      selectedFile = null;
      document.getElementById('previewContainer').classList.add('hidden');
      document.getElementById('fileInput').value = '';
      document.getElementById('uploadStatus').innerHTML = '';
      document.getElementById('uploadBtn').innerHTML = 'Upload & Continue <i class="fas fa-arrow-right"></i>';
      wizard.data.nationalId.uploaded = false;
      wizard.data.nationalId.fileUrl = null;
      wizard.save();
    }

    function uploadAndNext() {
      if (wizard.data.nationalId.uploaded && !selectedFile) {
        window.location.href = './apply-step4.html';
        return;
      }

      const idNumber = document.getElementById('idNumber').value.trim();
      if (!idNumber) {
        document.getElementById('idError').classList.add('show');
        return;
      }
      document.getElementById('idError').classList.remove('show');

      if (!selectedFile) {
        showToast('Please select a file to upload.', 'error');
        return;
      }

      if (isUploading) return;
      isUploading = true;
      
      const btn = document.getElementById('uploadBtn');
      btn.disabled = true;
      btn.innerHTML = 'Uploading... <i class="fas fa-spinner fa-spin"></i>';

      const progressBar = document.getElementById('progressBar');
      const progressFill = document.getElementById('progressFill');
      progressBar.classList.add('active');

      let progress = 0;
      const interval = setInterval(() => {
        progress += 8;
        if (progress <= 90) {
          progressFill.style.width = progress + '%';
        }
      }, 100);

      setTimeout(() => {
        clearInterval(interval);
        progressFill.style.width = '100%';
        
        const fileUrl = URL.createObjectURL(selectedFile);
        wizard.setNationalId(idNumber, selectedFile, fileUrl);
        wizard.setNationalIdUploaded('doc_' + Date.now());
        
        document.getElementById('uploadStatus').innerHTML = 
          '<span style="color:var(--success);font-weight:500;">✅ Upload successful!</span>';
        
        btn.innerHTML = 'Continue <i class="fas fa-arrow-right"></i>';
        btn.disabled = false;
        isUploading = false;
        
        showToast('ID uploaded successfully!', 'success');
        
        setTimeout(() => {
          window.location.href = './apply-step4.html';
        }, 800);
        
      }, 2000);
    }

    document.getElementById('idNumber').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        uploadAndNext();
      }
    });
  </script>
</body>
</html>

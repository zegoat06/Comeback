<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - SwiftBank</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/components.css" />

  <style>
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-4);
      margin-bottom: var(--space-6);
    }
    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div id="sidebar-container"></div>

  <header class="app-header">
    <div class="header-left">
      <h1 class="header-title">Dashboard</h1>
      <span class="admin-badge">Admin</span>
    </div>
    <div class="header-right">
      <div class="header-user">
        <span class="avatar" id="admin-avatar">A</span>
        <span id="admin-name">Admin</span>
      </div>
      <button onclick="logout()" class="btn btn-ghost btn-sm">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </header>

  <main class="main-content">

    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <span class="stat-icon">📋</span>
        <div class="stat-number" id="stat-pending">0</div>
        <div class="stat-label">Pending Applications</div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">✅</span>
        <div class="stat-number" id="stat-approved">0</div>
        <div class="stat-label">Approved</div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">❌</span>
        <div class="stat-number" id="stat-rejected">0</div>
        <div class="stat-label">Rejected</div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">👥</span>
        <div class="stat-number" id="stat-total-users">0</div>
        <div class="stat-label">Total Users</div>
      </div>
    </div>

    <div class="card recent-applications">
      <div class="card-header">
        <h2 class="card-title">Recent Applications</h2>
        <a href="applications.html" class="btn btn-ghost btn-sm">
          View All <i class="fas fa-arrow-right"></i>
        </a>
      </div>
      <div class="table-container" id="recent-table">
        <div class="empty-state">
          <span class="empty-icon">⏳</span>
          <h3>Loading...</h3>
        </div>
      </div>
    </div>

  </main>

  <div id="toast-container"></div>

  <script src="../../js/helpers.js"></script>
  <script src="../../js/api.js"></script>

  <script>
    // ==========================
    // LOAD SIDEBAR
    // ==========================
    fetch('../../pages/shared/sidebar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('sidebar-container').innerHTML = html;
        document.querySelector('.sidebar-nav a[data-page="dashboard"]')?.classList.add('active');
      })
      .catch(err => console.error('Sidebar error:', err));

    // ==========================
    // LOAD ADMIN NAME
    // ==========================
    const user = getUserData();
    if (user) {
      const name = user.fullName || user.name || 'Admin';
      document.getElementById('admin-name').textContent = name;
      document.getElementById('admin-avatar').textContent = name.charAt(0).toUpperCase();
    }

    // ==========================
    // LOAD STATS FROM BACKEND
    // ==========================
    async function loadStats() {
      try {
        const [apps, users] = await Promise.all([
          api.getAllApplications(),
          api.getAllUsers(),
        ]);

        const pending = apps.filter(a =>
          a.status === 'PENDING' || a.status === 'pending' ||
          a.status === 'RESUBMISSION' || a.status === 'resubmission'
        ).length;

        const approved = apps.filter(a =>
          a.status === 'APPROVED' || a.status === 'approved'
        ).length;

        const rejected = apps.filter(a =>
          a.status === 'REJECTED' || a.status === 'rejected'
        ).length;

        document.getElementById('stat-pending').textContent = pending;
        document.getElementById('stat-approved').textContent = approved;
        document.getElementById('stat-rejected').textContent = rejected;
        document.getElementById('stat-total-users').textContent = users.length;

      } catch (error) {
        console.error('Stats error:', error);
      }
    }

    // ==========================
    // LOAD RECENT APPLICATIONS
    // ==========================
    async function loadRecentApplications() {
      const container = document.getElementById('recent-table');

      try {
        const apps = await api.getAllApplications();

        const pendingApps = apps.filter(a =>
          a.status === 'PENDING' || a.status === 'pending' ||
          a.status === 'RESUBMISSION' || a.status === 'resubmission'
        );

        if (pendingApps.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <span class="empty-icon">✅</span>
              <h3>All caught up!</h3>
              <p>No pending applications to review.</p>
            </div>
          `;
          return;
        }

        const recent = pendingApps.slice(0, 5);

        let html = `
          <table>
            <thead>
              <tr>
                <th>Customer</th>
                <th>Account Type</th>
                <th>Submitted</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
        `;

        recent.forEach(app => {
          const name = app.customer?.user?.fullName || app.customerName || 'Unknown';
          const date = app.submittedAt || app.createdAt;
          const type = app.accountType || 'Savings';

          html += `
            <tr>
              <td><strong>${name}</strong></td>
              <td>${type}</td>
              <td>${date ? new Date(date).toLocaleDateString() : '-'}</td>
              <td><span class="badge badge-pending">Pending</span></td>
              <td>
                <a href="application-detail.html?id=${app.id}" class="btn btn-sm btn-primary">
                  Review
                </a>
              </td>
            </tr>
          `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;

      } catch (error) {
        console.error('Recent apps error:', error);
        container.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">⚠️</span>
            <h3>Could not load applications</h3>
            <p>Check if backend is running.</p>
            <button class="btn btn-primary" onclick="loadRecentApplications()">Retry</button>
          </div>
        `;
      }
    }

    // ==========================
    // AUTO-REFRESH
    // ==========================
    window.addEventListener('focus', () => {
      loadStats();
      loadRecentApplications();
    });

    setInterval(() => {
      loadStats();
      loadRecentApplications();
    }, 15000);

    // ==========================
    // INITIAL LOAD
    // ==========================
    loadStats();
    loadRecentApplications();
  </script>

</body>
</html>

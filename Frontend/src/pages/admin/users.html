<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management - Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/components.css" />
</head>
<body>
  <div id="sidebar-container"></div>
  <header class="app-header">
    <div class="header-left">
      <h1 class="header-title">User Management</h1>
      <span class="admin-badge">Admin</span>
    </div>
    <div class="header-right">
      <div class="header-user">
        <span class="avatar" id="admin-avatar">A</span>
        <span id="admin-name">Admin</span>
      </div>
      <button onclick="logout()" class="btn btn-ghost btn-sm">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </header>
  <main class="main-content">
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">All Users</h2>
        <button class="btn btn-primary btn-sm" onclick="openAddUserModal()">
          <i class="fas fa-plus"></i> Add User
        </button>
      </div>
      <div class="table-container" id="users-table">
        <div class="empty-state"><span class="empty-icon">⏳</span><h3>Loading...</h3></div>
      </div>
    </div>
  </main>
  <div id="toast-container"></div>
  <script src="../../js/api.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    // LOAD SIDEBAR
    fetch('../../pages/shared/sidebar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('sidebar-container').innerHTML = html;
        document.querySelector('.sidebar-nav a[data-page="users"]')?.classList.add('active');
      });

    const user = getCurrentUser();
    if (user) {
      document.getElementById('admin-name').textContent = user.name || 'Admin';
      document.getElementById('admin-avatar').textContent = (user.name || 'A')[0].toUpperCase();
    }

    // LOAD USERS - Use AdminAPI directly
    async function loadUsers() {
      try {
        // Use AdminAPI.getUsers directly
        const users = await AdminAPI.getUsers();
        const container = document.getElementById('users-table');

        if (!users || users.length === 0) {
          container.innerHTML = `<div class="empty-state"><span class="empty-icon">👥</span><h3>No users yet</h3><p>Users will appear here once they register.</p></div>`;
          return;
        }

        let html = `<table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th><th>Status</th><th>Action</th></tr></thead><tbody>`;
        users.forEach(u => {
          html += `<tr><td><strong>${u.name || 'Unknown'}</strong></td><td>${u.email || '-'}</td><td>${u.phone || '-'}</td><td>${u.createdAt ? new Date(u.createdAt).toLocaleDateString() : '-'}</td><td><span class="badge badge-approved">Active</span></td><td><button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}')"><i class="fas fa-trash"></i></button></td></tr>`;
        });
        html += `</tbody></table>`;
        container.innerHTML = html;
      } catch (error) {
        showToast('Failed to load users', 'error');
        console.error(error);
        document.getElementById('users-table').innerHTML = `<div class="empty-state"><span class="empty-icon">⚠️</span><h3>Error loading users</h3><button class="btn btn-primary" onclick="loadUsers()">Retry</button></div>`;
      }
    }

    function openAddUserModal() {
      openModal({
        title: 'Add New User',
        body: `
          <div class="input-group">
            <label>Full Name *</label>
            <input type="text" id="new-user-name" placeholder="John Doe" />
          </div>
          <div class="input-group">
            <label>Email *</label>
            <input type="email" id="new-user-email" placeholder="john@example.com" />
          </div>
          <div class="input-group">
            <label>Phone</label>
            <input type="tel" id="new-user-phone" placeholder="0999123456" />
          </div>
          <div class="input-group">
            <label>Password *</label>
            <input type="password" id="new-user-password" placeholder="••••••••" />
          </div>
          <p style="font-size: var(--text-xs); color: var(--ink-tertiary); margin-top: var(--space-2);">* Required fields</p>
        `,
        confirmText: 'Create User',
        onConfirm: async () => {
          const name = document.getElementById('new-user-name').value;
          const email = document.getElementById('new-user-email').value;
          const phone = document.getElementById('new-user-phone').value;
          const password = document.getElementById('new-user-password').value;

          if (!name || !email || !password) {
            showToast('Please fill in all required fields', 'error');
            return;
          }

          try {
            await AdminAPI.createUser({ name, email, phone, password });
            showToast('User created successfully! ✅', 'success');
            loadUsers();
          } catch (error) {
            showToast('Failed to create user: ' + error.message, 'error');
          }
        }
      });
    }

    async function deleteUser(id) {
      openModal({
        title: 'Delete User',
        body: `<p>Are you sure you want to delete this user? This action cannot be undone.</p>`,
        confirmText: 'Yes, Delete',
        onConfirm: async () => {
          try {
            await AdminAPI.deleteUser(id);
            showToast('User deleted successfully', 'warning');
            loadUsers();
          } catch (error) {
            showToast('Failed to delete user: ' + error.message, 'error');
          }
        }
      });
    }

    window.openAddUserModal = openAddUserModal;
    window.deleteUser = deleteUser;
    loadUsers();
  </script>
</body>
</html>

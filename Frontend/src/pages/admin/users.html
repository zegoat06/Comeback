<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management - Admin</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- OUR CSS -->
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/components.css" />
</head>
<body>

  <!-- SIDEBAR -->
  <div id="sidebar-container"></div>

  <!-- HEADER -->
  <header class="app-header">
    <div class="header-left">
      <h1 class="header-title">User Management</h1>
      <span class="admin-badge">Admin</span>
    </div>
    <div class="header-right">
      <div class="header-user">
        <span class="avatar" id="admin-avatar">A</span>
        <span id="admin-name">Admin</span>
      </div>
      <button onclick="logout()" class="btn btn-ghost btn-sm">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main-content">

    <div class="card">
      <div class="card-header">
        <h2 class="card-title">All Users</h2>
        <button class="btn btn-primary btn-sm" onclick="openAddUserModal()">
          <i class="fas fa-plus"></i> Add User
        </button>
      </div>

      <div class="table-container" id="users-table">
        <div class="empty-state">
          <span class="empty-icon">⏳</span>
          <h3>Loading...</h3>
        </div>
      </div>
    </div>

  </main>

  <!-- TOAST CONTAINER -->
  <div id="toast-container"></div>

  <!-- JAVASCRIPT -->
  <script src="../../js/api.js"></script>
  <script src="../../js/components.js"></script>

  <script>
    
    // LOAD SIDEBAR
    fetch('../../pages/shared/sidebar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('sidebar-container').innerHTML = html;
        document.querySelector('.sidebar-nav a[data-page="users"]')?.classList.add('active');
      });

    // LOAD ADMIN NAME
    const user = getCurrentUser();
    if (user) {
      document.getElementById('admin-name').textContent = user.name || 'Admin';
      document.getElementById('admin-avatar').textContent = (user.name || 'A')[0].toUpperCase();
    }

    // USER DATA WITH localStorage

    function loadUsersFromStorage() {
      const stored = localStorage.getItem('swiftbank_users');
      if (stored) {
        return JSON.parse(stored);
      }
      
      // Default data (only used once)
      const defaultUsers = [
        { id: '1', name: 'John Doe', email: 'john@example.com', phone: '0999123456', createdAt: '2026-07-15T10:30:00' },
        { id: '2', name: 'Mary Jane', email: 'mary@example.com', phone: '0999234567', createdAt: '2026-07-14T14:20:00' },
        { id: '3', name: 'Peter Mwale', email: 'peter@example.com', phone: '0999345678', createdAt: '2026-07-13T09:15:00' },
        { id: '4', name: 'Sarah Banda', email: 'sarah@example.com', phone: '0999456789', createdAt: '2026-07-12T16:45:00' },
        { id: '5', name: 'David Kumwenda', email: 'david@example.com', phone: '0999567890', createdAt: '2026-07-11T11:00:00' }
      ];
      
      localStorage.setItem('swiftbank_users', JSON.stringify(defaultUsers));
      return defaultUsers;
    }

    // Load data from localStorage or create default
    let mockUsers = loadUsersFromStorage();

    function saveUsersToStorage() {
      localStorage.setItem('swiftbank_users', JSON.stringify(mockUsers));
    }

    // OVERRIDE API WITH localStorage

    // Override API call with localStorage data
    const originalGetUsers = AdminAPI.getUsers;
    AdminAPI.getUsers = function() {
      return new Promise((resolve) => {
        // Reload from storage in case another tab changed it
        const stored = localStorage.getItem('swiftbank_users');
        if (stored) {
          mockUsers = JSON.parse(stored);
        }
        resolve(mockUsers);
      });
    };

    AdminAPI.createUser = function(data) {
      return new Promise((resolve) => {
        const newUser = {
          id: String(mockUsers.length + 1),
          ...data,
          createdAt: new Date().toISOString()
        };
        mockUsers.push(newUser);
        saveUsersToStorage();
        resolve(newUser);
      });
    };

    AdminAPI.deleteUser = function(id) {
      return new Promise((resolve) => {
        const index = mockUsers.findIndex(u => u.id === id);
        if (index !== -1) {
          mockUsers.splice(index, 1);
          saveUsersToStorage();
        }
        resolve({ success: true });
      });
    };

    // LOAD USERS
    async function loadUsers() {
      try {
        const users = await AdminAPI.getUsers();
        const container = document.getElementById('users-table');

        if (!users || users.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <span class="empty-icon">👥</span>
              <h3>No users yet</h3>
              <p>Users will appear here once they register.</p>
            </div>
          `;
          return;
        }

        let html = `
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Joined</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
        `;

        users.forEach(u => {
          html += `
            <tr>
              <td><strong>${u.name || 'Unknown'}</strong></td>
              <td>${u.email || '-'}</td>
              <td>${u.phone || '-'}</td>
              <td>${u.createdAt ? new Date(u.createdAt).toLocaleDateString() : '-'}</td>
              <td><span class="badge badge-approved">Active</span></td>
              <td>
                <button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}')">
                  <i class="fas fa-trash"></i>
                </button>
              </td>
            </tr>
          `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;

      } catch (error) {
        showToast('Failed to load users', 'error');
        console.error(error);

        const container = document.getElementById('users-table');
        container.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">⚠️</span>
            <h3>Error loading users</h3>
            <p>Please check your connection and try again.</p>
            <button class="btn btn-primary" onclick="loadUsers()">Retry</button>
          </div>
        `;
      }
    }

    // ADD USER MODAL
    function openAddUserModal() {
      openModal({
        title: 'Add New User',
        body: `
          <div class="input-group">
            <label>Full Name *</label>
            <input type="text" id="new-user-name" placeholder="John Doe" />
          </div>
          <div class="input-group">
            <label>Email *</label>
            <input type="email" id="new-user-email" placeholder="john@example.com" />
          </div>
          <div class="input-group">
            <label>Phone</label>
            <input type="tel" id="new-user-phone" placeholder="0999123456" />
          </div>
          <div class="input-group">
            <label>Password *</label>
            <input type="password" id="new-user-password" placeholder="••••••••" />
          </div>
          <p style="font-size: var(--text-xs); color: var(--ink-tertiary); margin-top: var(--space-2);">
            * Required fields
          </p>
        `,
        confirmText: 'Create User',
        onConfirm: async () => {
          const name = document.getElementById('new-user-name').value;
          const email = document.getElementById('new-user-email').value;
          const phone = document.getElementById('new-user-phone').value;
          const password = document.getElementById('new-user-password').value;

          if (!name || !email || !password) {
            showToast('Please fill in all required fields', 'error');
            return;
          }

          // Add to mock data AND save to localStorage
          const newUser = {
            id: String(mockUsers.length + 1),
            name: name,
            email: email,
            phone: phone || '-',
            createdAt: new Date().toISOString()
          };
          mockUsers.push(newUser);
          saveUsersToStorage(); // 💾 SAVE TO localStorage

          showToast('User created successfully! ✅', 'success');
          loadUsers();
        }
      });
    }

    // DELETE USER
    async function deleteUser(id) {
      openModal({
        title: 'Delete User',
        body: `<p>Are you sure you want to delete this user? This action cannot be undone.</p>`,
        confirmText: 'Yes, Delete',
        onConfirm: async () => {
          // Remove from mock data AND localStorage
          const index = mockUsers.findIndex(u => u.id === id);
          if (index !== -1) {
            mockUsers.splice(index, 1);
            saveUsersToStorage(); // 💾 SAVE TO localStorage
          }
          showToast('User deleted successfully', 'warning');
          loadUsers();
        }
      });
    }


    // MAKE FUNCTIONS GLOBAL
    window.openAddUserModal = openAddUserModal;
    window.deleteUser = deleteUser;

    // INITIAL LOAD
    loadUsers();
  </script>

</body>
</html>

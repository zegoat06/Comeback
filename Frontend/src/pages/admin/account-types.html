<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Types - Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/components.css" />
</head>
<body>
  <div id="sidebar-container"></div>
  <header class="app-header">
    <div class="header-left">
      <h1 class="header-title">Account Types</h1>
      <span class="admin-badge">Admin</span>
    </div>
    <div class="header-right">
      <div class="header-user">
        <span class="avatar" id="admin-avatar">A</span>
        <span id="admin-name">Admin</span>
      </div>
      <button onclick="logout()" class="btn btn-ghost btn-sm">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </header>
  <main class="main-content">
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Account Types</h2>
        <button class="btn btn-primary btn-sm" onclick="openAddTypeModal()">
          <i class="fas fa-plus"></i> Add Type
        </button>
      </div>
      <div class="table-container" id="types-table">
        <div class="empty-state"><span class="empty-icon">⏳</span><h3>Loading...</h3></div>
      </div>
    </div>
  </main>
  <div id="toast-container"></div>
  <script src="../../js/api.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    // LOAD SIDEBAR
    fetch('../../pages/shared/sidebar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('sidebar-container').innerHTML = html;
        document.querySelector('.sidebar-nav a[data-page="account-types"]')?.classList.add('active');
      });

    const user = getCurrentUser();
    if (user) {
      document.getElementById('admin-name').textContent = user.name || 'Admin';
      document.getElementById('admin-avatar').textContent = (user.name || 'A')[0].toUpperCase();
    }

    // LOAD ACCOUNT TYPES - Use AdminAPI directly
    async function loadAccountTypes() {
      try {
        // Use AdminAPI.getAccountTypes directly
        const types = await AdminAPI.getAccountTypes();
        const container = document.getElementById('types-table');

        if (!types || types.length === 0) {
          container.innerHTML = `<div class="empty-state"><span class="empty-icon">📂</span><h3>No account types</h3><p>Add your first account type to get started.</p></div>`;
          return;
        }

        let html = `<table><thead><tr><th>Name</th><th>Description</th><th>Created</th><th>Action</th></tr></thead><tbody>`;
        types.forEach(t => {
          html += `<tr><td><strong>${t.name || 'Unknown'}</strong></td><td>${t.description || '-'}</td><td>${t.createdAt ? new Date(t.createdAt).toLocaleDateString() : '-'}</td><td><button class="btn btn-sm btn-danger" onclick="deleteType('${t.id}')"><i class="fas fa-trash"></i></button></td></tr>`;
        });
        html += `</tbody></table>`;
        container.innerHTML = html;
      } catch (error) {
        showToast('Failed to load account types', 'error');
        console.error(error);
        document.getElementById('types-table').innerHTML = `<div class="empty-state"><span class="empty-icon">⚠️</span><h3>Error loading account types</h3><button class="btn btn-primary" onclick="loadAccountTypes()">Retry</button></div>`;
      }
    }

    function openAddTypeModal() {
      openModal({
        title: 'Add Account Type',
        body: `
          <div class="input-group">
            <label>Name *</label>
            <input type="text" id="new-type-name" placeholder="e.g., Premium Savings" />
          </div>
          <div class="input-group">
            <label>Description</label>
            <textarea id="new-type-desc" placeholder="e.g., High-interest savings account with benefits" style="min-height: 60px;"></textarea>
          </div>
          <p style="font-size: var(--text-xs); color: var(--ink-tertiary); margin-top: var(--space-2);">* Required field</p>
        `,
        confirmText: 'Create Type',
        onConfirm: async () => {
          const name = document.getElementById('new-type-name').value;
          const description = document.getElementById('new-type-desc').value;
          if (!name) {
            showToast('Please enter a name', 'error');
            return;
          }
          try {
            await AdminAPI.createAccountType({ name, description });
            showToast('Account type created! ✅', 'success');
            loadAccountTypes();
          } catch (error) {
            showToast('Failed to create account type: ' + error.message, 'error');
          }
        }
      });
    }

    async function deleteType(id) {
      openModal({
        title: 'Delete Account Type',
        body: `<p>Are you sure you want to delete this account type?</p><p style="color: var(--ink-secondary); font-size: var(--text-sm); margin-top: var(--space-2);">This action cannot be undone.</p>`,
        confirmText: 'Yes, Delete',
        onConfirm: async () => {
          try {
            await AdminAPI.deleteAccountType(id);
            showToast('Account type deleted', 'warning');
            loadAccountTypes();
          } catch (error) {
            showToast('Failed to delete account type: ' + error.message, 'error');
          }
        }
      });
    }

    window.openAddTypeModal = openAddTypeModal;
    window.deleteType = deleteType;
    loadAccountTypes();
  </script>
</body>
</html>

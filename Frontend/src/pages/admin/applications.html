<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Applications - Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <style>
    .filter-bar {
      display: flex;
      gap: var(--space-4);
      margin-bottom: var(--space-6);
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-bar .input-group { margin-bottom: 0; flex: 1; min-width: 200px; }
    .filter-bar select { max-width: 200px; }
    .search-input { max-width: 300px; }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <header class="app-header">
    <div class="header-left">
      <h1 class="header-title">Applications</h1>
      <span class="admin-badge">Admin</span>
    </div>
    <div class="header-right">
      <div class="header-user">
        <span class="avatar" id="admin-avatar">A</span>
        <span id="admin-name">Admin</span>
      </div>
      <button onclick="logout()" class="btn btn-ghost btn-sm">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </header>
  <main class="main-content">
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">All Applications</h2>
        <span id="total-count" style="color: var(--ink-secondary); font-size: var(--text-sm);">0 total</span>
      </div>
      <div class="filter-bar">
        <div class="input-group search-input">
          <input type="text" id="search-input" placeholder="🔍 Search by name or ID..." />
        </div>
        <div class="input-group">
          <select id="status-filter">
            <option value="all">All Status</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
            <option value="resubmission">Resubmission</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="loadApplications()">
          <i class="fas fa-sync-alt"></i> Refresh
        </button>
      </div>
      <div class="table-container" id="applications-table">
        <div class="empty-state"><span class="empty-icon">⏳</span><h3>Loading...</h3></div>
      </div>
    </div>
  </main>
  <div id="toast-container"></div>
  <script src="../../js/api.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    // LOAD SIDEBAR
    fetch('../../pages/shared/sidebar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('sidebar-container').innerHTML = html;
        document.querySelector('.sidebar-nav a[data-page="applications"]')?.classList.add('active');
      });

    const user = getCurrentUser();
    if (user) {
      document.getElementById('admin-name').textContent = user.name || 'Admin';
      document.getElementById('admin-avatar').textContent = (user.name || 'A')[0].toUpperCase();
    }

    // LOAD APPLICATIONS - Using AdminAPI directly
    async function loadApplications() {
      const status = document.getElementById('status-filter').value;
      const search = document.getElementById('search-input').value.toLowerCase();

      try {
        // Use AdminAPI.getApplications directly
        const apps = await AdminAPI.getApplications(status === 'all' ? null : status);
        const container = document.getElementById('applications-table');
        const filtered = apps.filter(app => {
          const name = (app.customerName || '').toLowerCase();
          const id = (app.id || '').toLowerCase();
          return name.includes(search) || id.includes(search);
        });

        document.getElementById('total-count').textContent = `${filtered.length} total`;

        if (!filtered || filtered.length === 0) {
          container.innerHTML = `<div class="empty-state"><span class="empty-icon">📭</span><h3>No applications found</h3><p>Try changing your filters or check back later.</p></div>`;
          return;
        }

        let html = `<table><thead><tr><th>Customer</th><th>Account Type</th><th>ID Number</th><th>Submitted</th><th>Status</th><th>Action</th></tr></thead><tbody>`;
        filtered.forEach(app => {
          const statusClass = app.status === 'approved' ? 'badge-approved' : app.status === 'rejected' ? 'badge-rejected' : app.status === 'resubmission' ? 'badge-resubmission' : 'badge-pending';
          const statusLabel = app.status ? app.status.charAt(0).toUpperCase() + app.status.slice(1) : 'Pending';
          html += `<tr><td><strong>${app.customerName || 'Unknown'}</strong></td><td>${app.accountType || 'Savings'}</td><td>${app.idNumber || 'N/A'}</td><td>${app.createdAt ? new Date(app.createdAt).toLocaleDateString() : '-'}</td><td><span class="badge ${statusClass}">${statusLabel}</span></td><td><a href="application-detail.html?id=${app.id}" class="btn btn-sm btn-primary"><i class="fas fa-eye"></i> View</a></td></tr>`;
        });
        html += `</tbody></table>`;
        container.innerHTML = html;
      } catch (error) {
        showToast('Failed to load applications', 'error');
        console.error(error);
        document.getElementById('applications-table').innerHTML = `<div class="empty-state"><span class="empty-icon">⚠️</span><h3>Error loading applications</h3><button class="btn btn-primary" onclick="loadApplications()">Retry</button></div>`;
      }
    }

    document.getElementById('status-filter').addEventListener('change', loadApplications);
    document.getElementById('search-input').addEventListener('input', loadApplications);
    loadApplications();
  </script>
</body>
</html>

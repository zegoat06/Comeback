<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - SWIFTb</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <style>
    .auth-container {
      max-width: 400px;
      margin: 40px auto;
      padding: var(--space);
    }
    .auth-container .logo {
      text-align: center;
      font-family: 'Poppins', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: var(--space);
    }
    .auth-container .logo span { color: var(--accent); }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="logo">SWIFT<span>b</span></div>
    <div class="card">
      <h2 style="text-align:center;">Create Account</h2>
      <p class="text-center text-muted">Open your account in minutes</p>

      <form id="registerForm" class="mt-2" onsubmit="handleRegister(event)">
        <div class="input-group">
          <label>Full Name *</label>
          <input type="text" id="fullName" placeholder="John Doe" required />
        </div>
        <div class="input-group">
          <label>Email *</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="input-group">
          <label>Phone Number *</label>
          <input type="tel" id="phone" placeholder="+265 888 123 456" required />
        </div>
        <div class="input-group">
          <label>Password *</label>
          <input type="password" id="password" placeholder="Min 8 characters" required />
        </div>
        <div class="input-group">
          <label>Confirm Password *</label>
          <input type="password" id="confirmPassword" placeholder="Confirm your password" required />
        </div>

        <button type="submit" class="btn btn-gold btn-block">
          <i class="fas fa-user-plus"></i> Create Account
        </button>
      </form>

      <p class="text-center mt-2" style="font-size:0.875rem;">
        Already have an account? <a href="./loginPage.html">Log in</a>
      </p>
    </div>
  </div>

  <script src="./js/app.js"></script>
  <script src="./js/api.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      
      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!fullName || !email || !phone || !password) {
        showToast('Please fill in all required fields.', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showToast('Passwords do not match.', 'error');
        return;
      }

      if (password.length < 8) {
        showToast('Password must be at least 8 characters.', 'error');
        return;
      }

      try {
        await api.register({ fullName, email, phoneNumber: phone, password });
        showToast('Registration successful! Please log in.', 'success');
        setTimeout(() => {
          window.location.href = './loginPage.html';
        }, 1500);
      } catch (error) {
        showToast('Registration failed: ' + error.message, 'error');
      }
    }
  </script>
</body>
</html>
